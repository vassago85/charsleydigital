<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2000" viewBox="0 0 2000 2000">
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <g fill="#e2e8f0" opacity="0.5">
    <circle cx="100" cy="100" r="2"/>
    <circle cx="300" cy="100" r="2"/>
    <circle cx="500" cy="100" r="2"/>
    <circle cx="100" cy="300" r="2"/>
    <circle cx="300" cy="300" r="2"/>
    <circle cx="500" cy="300" r="2"/>
  </g>
  <defs><pattern id="p" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#cbd5e1"/>
    <circle cx="120" cy="20" r="1" fill="#cbd5e1"/>
    <circle cx="20" cy="120" r="1" fill="#cbd5e1"/>
    <circle cx="120" cy="120" r="1" fill="#cbd5e1"/>
  </pattern></defs>
  <rect width="100%" height="100%" fill="url(#p)"/>
